<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Gamefowl Finance Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
header{position:sticky;top:0;z-index:10;background:#111827;color:white;padding:14px max(16px,env(safe-area-inset-left)) 12px}
header h1{font-size:20px;margin:0 0 3px}.sub{font-size:12px;opacity:.75}
nav{display:flex;gap:7px;overflow:auto;padding:9px 0 0}nav button{border:0;border-radius:999px;padding:8px 12px;background:#374151;color:white;white-space:nowrap}
nav button.active{background:#fff;color:#111827}
main{max-width:1100px;margin:auto;padding:14px}.tab{display:none}.tab.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 4px #0001}.label{font-size:12px;color:#6b7280}.value{font-size:22px;font-weight:750;margin-top:4px}
h2{font-size:18px;margin:8px 0 12px}h3{font-size:15px;margin:5px 0 10px}
section{margin-bottom:18px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
label{font-size:12px;color:#4b5563;display:block}input,select,button,textarea{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;background:#fff;margin-top:4px}
.btn{border:0;border-radius:9px;padding:10px 13px;background:#111827;color:#fff}.btn.secondary{background:#e5e7eb;color:#111827}.btn.danger{background:#b91c1c}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:12px;overflow:hidden}.table th,.table td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}.table th{background:#f9fafb}
.trio{border-left:5px solid #111827}.muted{color:#6b7280;font-size:12px}.pill{display:inline-block;background:#eef2ff;border-radius:999px;padding:4px 8px;font-size:11px;margin:2px}
.notice{background:#fff7ed;border:1px solid #fed7aa;padding:10px;border-radius:10px;font-size:13px}
@media(max-width:600px){main{padding:10px}.grid{grid-template-columns:repeat(2,1fr)}.card{padding:11px}.value{font-size:18px}.table{font-size:12px}}
</style>
</head>
<body>
<header>
<h1>Gamefowl Finance Tracker</h1><div class="sub">Mobile-friendly • works offline • data saved on this device</div>
<nav id="nav"></nav>
</header>
<main>
<div id="dashboard" class="tab active"></div>
<div id="trios" class="tab"></div>
<div id="production" class="tab"></div>
<div id="sales" class="tab"></div>
<div id="expenses" class="tab"></div>
<div id="partners" class="tab"></div>
<div id="data" class="tab"></div>
</main>
<script>
const KEY="gamefowl_finance_v2";
const defaultState={
 settings:{salePrice:1000, partners:[
  {id:"p1",name:"Managing Partner",share:500},
  {id:"p2",name:"Partner 2",share:250},
  {id:"p3",name:"Partner 3",share:250}
 ]},
 trios:[
  {id:"t1",name:"Trio 1",capital:86000, housing:17000, notes:""},
  {id:"t2",name:"Trio 2",capital:86000, housing:17000, notes:""}
 ],
 expenses:[], production:[], sales:[]
};
let S=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaultState)}catch(e){return structuredClone(defaultState)}}
function save(){localStorage.setItem(KEY,JSON.stringify(S));render()}
function peso(n){return "₱"+Number(n||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
const tabs=[["dashboard","Dashboard"],["trios","2 Trios"],["production","Production"],["sales","Sales"],["expenses","Expenses"],["partners","Partners"],["data","Backup"]];
document.getElementById("nav").innerHTML=tabs.map((x,i)=>`<button class="${i?'':'active'}" onclick="tab('${x[0]}',this)">${x[1]}</button>`).join("");
function tab(id,b){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}
function initialExpense(){
 return S.trios.reduce((a,t)=>a+Number(t.capital||0)+Number(t.housing||0),0)
 +S.expenses.filter(e=>e.type==="initial").reduce((a,e)=>a+Number(e.amount||0),0);
}
function totalExpenses(){return initialExpense()+S.expenses.filter(e=>e.type!=="initial").reduce((a,e)=>a+Number(e.amount||0),0)}
function productionTotals(trioId){
 let p=S.production.filter(x=>x.trioId===trioId);
 return {
 eggs:p.reduce((a,x)=>a+Number(x.eggs||0),0),
 infertile:p.reduce((a,x)=>a+Number(x.infertile||0),0),
 unhatched:p.reduce((a,x)=>a+Number(x.unhatched||0),0),
 hatched:p.reduce((a,x)=>a+Number(x.hatched||0),0),
 dead:p.reduce((a,x)=>a+Number(x.dead||0),0),
 unsaleable:p.reduce((a,x)=>a+Number(x.unsaleable||0),0),
 retained:p.reduce((a,x)=>a+Number(x.retained||0),0),
 saleable:p.reduce((a,x)=>a+Number(x.saleable||0),0)
 }
}
function soldQty(trioId){return S.sales.filter(x=>x.trioId===trioId).reduce((a,x)=>a+Number(x.qty||0),0)}
function revenue(){return S.sales.reduce((a,x)=>a+Number(x.qty||0)*Number(x.price||S.settings.salePrice),0)}
function cards(arr){return `<div class="grid">${arr.map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div>${x[2]?`<div class="muted">${x[2]}</div>`:""}</div>`).join("")}</div>`}
function renderDashboard(){
 let rev=revenue(), exp=totalExpenses(), profit=rev-exp;
 let potential=S.production.reduce((a,x)=>a+Number(x.saleable||0),0)*S.settings.salePrice;
 let sold=S.sales.reduce((a,x)=>a+Number(x.qty||0),0);
 document.getElementById("dashboard").innerHTML=`
 <section><h2>Project Dashboard</h2>${cards([
 ["Initial Expense / Capital",peso(initialExpense()),"Includes trio capital, housing/cages, and additional initial capital expenses"],
 ["Operating Expenses",peso(exp-initialExpense()),"Non-initial expenses"],
 ["Total Investment / Expenses",peso(exp)],
 ["Actual Revenue",peso(rev),`${sold} birds sold`],
 ["Net Profit / (Loss)",peso(profit)],
 ["Potential Revenue",peso(potential),"Based on recorded saleable birds × default sale price"],
 ["Unrealized Potential",peso(Math.max(0,potential-rev)),"Saleable production not yet realized as revenue"],
 ["Default Sale Price",peso(S.settings.salePrice)]
 ])}</section>
 <section><h2>Partner Income</h2>
<div class="grid">${S.settings.partners.map(p=>{
 let income=S.sales.reduce((a,x)=>a+Number(x.qty||0)*(Number(x.price||S.settings.salePrice)/Number(S.settings.salePrice||1))*Number(p.share||0),0);
 return `<div class="card"><div class="label">${esc(p.name)}</div><div class="value">${peso(income)}</div><div class="muted">${peso(p.share)} per default ₱${Number(S.settings.salePrice).toLocaleString("en-PH")} sale</div></div>`
}).join("")}</div>
</section>
<section><h2>Two Separate Trios</h2><div class="grid">${S.trios.map(t=>{let p=productionTotals(t.id),r=S.sales.filter(x=>x.trioId===t.id).reduce((a,x)=>a+x.qty*x.price,0),e=Number(t.capital||0)+Number(t.housing||0)+S.expenses.filter(x=>x.trioId===t.id).reduce((a,x)=>a+Number(x.amount||0),0);return `<div class="card trio"><h3>${esc(t.name)}</h3><div>${cards([["Initial Capital",peso(Number(t.capital)+Number(t.housing))],["Eggs",p.eggs],["Hatched",p.hatched],["Saleable",p.saleable],["Sold",soldQty(t.id)],["Revenue",peso(r)],["Expenses",peso(e)],["Net",peso(r-e)]])}</div></div>`}).join("")}</div></section>
 <section class="notice"><b>Accounting rule:</b> Additional capital expenses are entered as <b>Initial Expenses</b> and are automatically included in the Dashboard's Initial Expense total. They are not shown as a separate capital category.</section>`;
}
function renderTrios(){
 document.getElementById("trios").innerHTML=`<section><h2>Manage 2 Separate Trios</h2>${S.trios.map((t,i)=>`<div class="card trio" style="margin-bottom:12px"><h3>${esc(t.name)}</h3><div class="row">
 <label>Trio name<input id="tn${i}" value="${esc(t.name)}"></label>
 <label>Breeding capital<input type="number" id="tc${i}" value="${t.capital}"></label>
 <label>Housing / cage capital<input type="number" id="th${i}" value="${t.housing}"></label>
 <label>Notes<input id="tx${i}" value="${esc(t.notes)}"></label></div><button class="btn" onclick="updateTrio(${i})">Save Trio</button></div>`).join("")}</section>
 <section class="card"><h3>Add Another Capital Expense</h3><div class="muted">This goes directly into Initial Expense on the Dashboard.</div><div class="row">
 <label>Trio<select id="iceTrio">${S.trios.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label>
 <label>Description<input id="iceDesc" placeholder="e.g. additional cage materials"></label>
 <label>Amount<input id="iceAmt" type="number" min="0" step="0.01"></label></div><button class="btn" onclick="addInitialExpense()">Add to Initial Expense</button></section>`;
}
function updateTrio(i){S.trios[i].name=document.getElementById("tn"+i).value||`Trio ${i+1}`;S.trios[i].capital=+document.getElementById("tc"+i).value||0;S.trios[i].housing=+document.getElementById("th"+i).value||0;S.trios[i].notes=document.getElementById("tx"+i).value;save()}
function addInitialExpense(){let a=+iceAmt.value||0;if(!a)return alert("Enter an amount.");S.expenses.push({id:crypto.randomUUID(),date:new Date().toISOString().slice(0,10),trioId:iceTrio.value,description:iceDesc.value||"Additional capital expense",amount:a,type:"initial"});save()}
function renderProduction(){
 document.getElementById("production").innerHTML=`<section class="card"><h2>Production / Incubation</h2><div class="row"><label>Trio<select id="prTrio">${S.trios.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label>
 <label>Date<input id="prDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label>
 <label>Eggs collected<input id="eggs" type="number" min="0"></label><label>Infertile<input id="infertile" type="number" min="0"></label><label>Failed / unhatched<input id="unhatched" type="number" min="0"></label><label>Hatched chicks<input id="hatched" type="number" min="0"></label><label>Dead chicks<input id="dead" type="number" min="0"></label><label>Living but unsaleable<input id="unsaleable" type="number" min="0"></label><label>Retained<input id="retained" type="number" min="0"></label><label>Saleable<input id="saleable" type="number" min="0"></label></div><button class="btn" onclick="addProduction()">Save Production Record</button></section>
 <section>${S.trios.map(t=>{let p=productionTotals(t.id);return `<div class="card trio"><h3>${esc(t.name)}</h3>${cards([["Eggs",p.eggs],["Infertile",p.infertile],["Unhatched",p.unhatched],["Hatched",p.hatched],["Dead",p.dead],["Unsaleable",p.unsaleable],["Retained",p.retained],["Saleable",p.saleable]])}</div>`}).join("")}</section>
 <section class="tablewrap"><table class="table"><tr><th>Date</th><th>Trio</th><th>Eggs</th><th>Hatched</th><th>Dead</th><th>Saleable</th></tr>${S.production.map(x=>`<tr><td>${x.date}</td><td>${esc(S.trios.find(t=>t.id===x.trioId)?.name)}</td><td>${x.eggs}</td><td>${x.hatched}</td><td>${x.dead}</td><td>${x.saleable}</td></tr>`).join("")}</table></section>`;
}
function addProduction(){let ids=["eggs","infertile","unhatched","hatched","dead","unsaleable","retained","saleable"];let x={id:crypto.randomUUID(),trioId:prTrio.value,date:prDate.value};ids.forEach(k=>x[k]=+document.getElementById(k).value||0);S.production.push(x);save()}
function renderSales(){
 document.getElementById("sales").innerHTML=`<section class="card"><h2>Sales</h2><div class="row"><label>Trio<select id="saTrio">${S.trios.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label><label>Date<input id="saDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Quantity<input id="saQty" type="number" min="1"></label><label>Price per bird<input id="saPrice" type="number" value="${S.settings.salePrice}" min="0"></label><label>Buyer / reference<input id="saBuyer"></label></div><button class="btn" onclick="addSale()">Record Sale</button></section>
 <section class="tablewrap"><table class="table"><tr><th>Date</th><th>Trio</th><th>Qty</th><th>Price</th><th>Revenue</th><th>Buyer</th></tr>${S.sales.map(x=>`<tr><td>${x.date}</td><td>${esc(S.trios.find(t=>t.id===x.trioId)?.name)}</td><td>${x.qty}</td><td>${peso(x.price)}</td><td>${peso(x.qty*x.price)}</td><td>${esc(x.buyer)}</td></tr>`).join("")}</table></section>`;
}
function addSale(){let q=+saQty.value||0,p=+saPrice.value||0;if(!q)return alert("Enter quantity.");S.sales.push({id:crypto.randomUUID(),trioId:saTrio.value,date:saDate.value,qty:q,price:p,buyer:saBuyer.value});save()}
function renderExpenses(){
 document.getElementById("expenses").innerHTML=`<section class="card"><h2>Expenses</h2><div class="muted">Use <b>Initial</b> for additional capital expenses such as cages, housing, equipment, or other startup capital. These are consolidated into Initial Expense on the Dashboard.</div><div class="row"><label>Type<select id="exType"><option value="operating">Operating</option><option value="initial">Initial / Capital</option></select></label><label>Trio<select id="exTrio">${S.trios.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label><label>Date<input id="exDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Description<input id="exDesc"></label><label>Amount<input id="exAmt" type="number" min="0" step=".01"></label></div><button class="btn" onclick="addExpense()">Add Expense</button></section>
 <section class="tablewrap"><table class="table"><tr><th>Date</th><th>Type</th><th>Trio</th><th>Description</th><th>Amount</th></tr>${S.expenses.map(x=>`<tr><td>${x.date}</td><td><span class="pill">${x.type}</span></td><td>${esc(S.trios.find(t=>t.id===x.trioId)?.name)}</td><td>${esc(x.description)}</td><td>${peso(x.amount)}</td></tr>`).join("")}</table></section>`;
}
function addExpense(){let a=+exAmt.value||0;if(!a)return alert("Enter amount.");S.expenses.push({id:crypto.randomUUID(),type:exType.value,trioId:exTrio.value,date:exDate.value,description:exDesc.value||"Expense",amount:a});save()}
function renderPartners(){
 document.getElementById("partners").innerHTML=`<section class="card"><h2>Partners & Sale Distribution</h2><div class="row"><label>Default sale price<input id="defPrice" type="number" value="${S.settings.salePrice}" min="0"></label>${S.settings.partners.map((p,i)=>`<label>Partner ${i+1} name<input id="pn${i}" value="${esc(p.name)}"></label><label>Partner ${i+1} share<input id="ps${i}" type="number" value="${p.share}" min="0"></label>`).join("")}</div><button class="btn" onclick="savePartners()">Save Partner Settings</button><p class="muted">Current default allocation: managing partner ₱500, Partner 2 ₱250, Partner 3 ₱250 per ₱1,000 sale. You can change it.</p></section>
 <section class="grid">${S.settings.partners.map(p=>`<div class="card"><div class="label">${esc(p.name)}</div><div class="value">${peso(p.share)}</div><div class="muted">per default sale</div></div>`).join("")}</section>`;
}
function savePartners(){S.settings.salePrice=+defPrice.value||0;S.settings.partners.forEach((p,i)=>{p.name=document.getElementById("pn"+i).value||`Partner ${i+1}`;p.share=+document.getElementById("ps"+i).value||0});save()}
function renderData(){
 document.getElementById("data").innerHTML=`<section class="card"><h2>Backup & Restore</h2><p class="muted">Your records are stored locally in this browser. Export a backup regularly so you can move the data between devices.</p><div class="actions"><button class="btn" onclick="downloadBackup()">Export Backup</button><label class="btn secondary" style="display:inline-block;cursor:pointer">Import Backup<input type="file" accept=".json" style="display:none" onchange="importBackup(event)"></label><button class="btn danger" onclick="resetData()">Reset All Data</button></div></section>
 <section class="card"><h3>Data structure</h3><p class="muted">Separate Trio 1 and Trio 2 accounting • eggs/incubation/hatching/deaths • saleable/retained/unsaleable • actual sales/revenue • initial and operating expenses • partner distribution • dashboard profit and recovery indicators.</p></section>`;
}
function downloadBackup(){let blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="gamefowl-finance-backup.json";a.click();URL.revokeObjectURL(a.href)}
function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.trios||!x.settings)throw 0;S=x;save();alert("Backup restored.")}catch{alert("Invalid backup file.")}};r.readAsText(f)}
function resetData(){if(confirm("Delete all records and restore a blank tracker?")){S=structuredClone(defaultState);save()}}
function render(){renderDashboard();renderTrios();renderProduction();renderSales();renderExpenses();renderPartners();renderData()}
render();
</script>
</body></html>
