<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Gamefowl Finance Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
header{position:sticky;top:0;z-index:10;background:#111827;color:white;padding:14px max(16px,env(safe-area-inset-left)) 12px}
header h1{font-size:20px;margin:0 0 3px}.sub{font-size:12px;opacity:.75}
nav{display:flex;gap:7px;overflow:auto;padding:9px 0 0}nav button{border:0;border-radius:999px;padding:8px 12px;background:#374151;color:white;white-space:nowrap}
nav button.active{background:#fff;color:#111827}
main{max-width:1100px;margin:auto;padding:14px}.tab{display:none}.tab.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 4px #0001}.label{font-size:12px;color:#6b7280}.value{font-size:22px;font-weight:750;margin-top:4px}
h2{font-size:18px;margin:8px 0 12px}h3{font-size:15px;margin:5px 0 10px}
section{margin-bottom:18px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
label{font-size:12px;color:#4b5563;display:block}input,select,button,textarea{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;background:#fff;color:#111827;margin-top:4px}input::placeholder,textarea::placeholder{color:#6b7280}input:disabled,select:disabled,textarea:disabled,input[readonly]{color:#111827;opacity:1}
.btn{border:0;border-radius:9px;padding:10px 13px;background:#111827;color:#fff}.btn.secondary{background:#e5e7eb;color:#111827}.btn.danger{background:#b91c1c}.btn.success{background:#166534}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:12px;overflow:hidden}.table th,.table td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}.table th{background:#f9fafb}
.trio{border-left:5px solid #111827}.muted{color:#6b7280;font-size:12px}.pill{display:inline-block;background:#eef2ff;border-radius:999px;padding:4px 8px;font-size:11px;margin:2px}
.notice{background:#fff7ed;border:1px solid #fed7aa;padding:10px;border-radius:10px;font-size:13px}
.sync-ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;padding:10px;border-radius:10px;font-size:13px}
.sync-warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:10px;border-radius:10px;font-size:13px}
.sync-bad{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:10px;border-radius:10px;font-size:13px}
.small{font-size:11px}

/* Mobile-first sales/records layout */
.sales-list{display:grid;gap:10px}
.sale-card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 4px #0001}
.sale-card .sale-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sale-card .sale-field label{font-size:11px;color:#6b7280}
.sale-card .sale-field input,.sale-card .sale-field select{font-size:16px;padding:11px}
.sale-card .sale-revenue{font-size:18px;font-weight:750;margin-top:4px}
.sale-card .sale-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sale-card .sale-actions button{width:100%;min-height:44px}
.mobile-only{display:none}
@media(max-width:600px){
  body{font-size:15px}
  header{padding:12px 10px}
  header h1{font-size:19px}
  .sub{font-size:11px;line-height:1.35}
  nav{gap:6px;padding:8px 0 2px}
  nav button{font-size:14px;padding:9px 13px;min-height:40px}
  main{padding:8px}
  .card{border-radius:12px;padding:12px}
  h2{font-size:19px}
  .row{grid-template-columns:1fr}
  input,select,textarea{font-size:16px;min-height:44px}
  .btn{min-height:44px}
  .tablewrap{overflow:visible}
  .mobile-only{display:block}
  /* Hide the wide sales table and use compact phone cards instead. */
  #sales .sales-wide-table{display:none}
  #sales .sales-mobile-list{display:grid}
  .sales-mobile-list{gap:10px}
  .sale-card .sale-grid{grid-template-columns:1fr 1fr}
  .sale-card .sale-actions{grid-template-columns:1fr 1fr}
}
@media(min-width:601px){
  #sales .sales-mobile-list{display:none}
}
@media(max-width:600px){main{padding:10px}.grid{grid-template-columns:repeat(2,1fr)}.card{padding:11px}.value{font-size:18px}}
</style>
</head>
<body>
<header>
<h1>Gamefowl Finance Tracker</h1>
<div class="sub">Mobile-friendly • offline-capable • cloud backup & multi-device synchronization</div>
<nav id="nav"></nav>
</header>
<main>
<div id="dashboard" class="tab active"></div>
<div id="trios" class="tab"></div>
<div id="production" class="tab"></div>
<div id="sales" class="tab"></div>
<div id="expenses" class="tab"></div>
<div id="partners" class="tab"></div>
<div id="data" class="tab"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/*
  CLOUD SETUP
  1. Create a Supabase project.
  2. Run the SQL in README.txt.
  3. Replace the two values below with your Supabase Project URL
     and Publishable Key. NEVER put a secret/service_role key here.
*/
const SUPABASE_URL="YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_PUBLISHABLE_KEY="YOUR_SUPABASE_PUBLISHABLE_KEY";
const cloudConfigured=SUPABASE_URL.startsWith("https://") && SUPABASE_PUBLISHABLE_KEY && !SUPABASE_PUBLISHABLE_KEY.includes("YOUR_");
const sb=cloudConfigured ? window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}) : null;

const KEY="gamefowl_finance_v2";
const defaultState={
 settings:{salePrice:1000,partners:[
  {id:"p1",name:"Charson",share:500},
  {id:"p2",name:"Mark",share:250},
  {id:"p3",name:"Rik2",share:250}
 ]},
 trios:[
  {id:"t1",name:"Golden Boy",capital:86000,housing:17000,notes:""},
  {id:"t2",name:"White Kelso",capital:86000,housing:17000,notes:""}
 ],
 expenses:[],production:[],sales:[]
};

let S=loadLocal();
let currentUser=null;
let cloudUpdatedAt=null;
let cloudChannel=null;
let cloudPollTimer=null;
let cloudBusy=false;
let cloudSaveQueued=false;
let lastCloudMessage="";
let realtimeStatus="disconnected";

function cloneDefault(){return typeof structuredClone==="function"?structuredClone(defaultState):JSON.parse(JSON.stringify(defaultState))}
function loadLocal(){try{return JSON.parse(localStorage.getItem(KEY))||cloneDefault()}catch(e){return cloneDefault()}}
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(S))}
function localHasData(){
 return !!(S.expenses.length||S.production.length||S.sales.length||
   S.trios.some(t=>Number(t.capital)||Number(t.housing)||t.name!=="Trio 1"&&t.name!=="Trio 2")||
   S.settings.salePrice!==1000||
   S.settings.partners.some((p,i)=>p.name!==defaultState.settings.partners[i]?.name||Number(p.share)!==Number(defaultState.settings.partners[i]?.share)));
}
function setMessage(msg){lastCloudMessage=msg;renderData();}

async function save(){
 saveLocal();
 render();
 if(currentUser) await saveCloud();
}

async function saveCloud(){
 if(!sb||!currentUser){return}
 if(cloudBusy){
  cloudSaveQueued=true;
  return;
 }
 cloudBusy=true;
 try{
  const now=new Date().toISOString();
  const snapshot=structuredClone(S);
  const {error}=await sb.from("app_state").upsert({
   user_id:currentUser.id,
   data:snapshot,
   updated_at:now
  },{onConflict:"user_id"});
  if(error)throw error;
  cloudUpdatedAt=now;
  lastCloudMessage="Cloud synced • "+new Date(now).toLocaleString();
 }catch(e){
  lastCloudMessage="Cloud sync failed: "+(e.message||e);
 }finally{
  cloudBusy=false;
  renderData();
  if(cloudSaveQueued){
   cloudSaveQueued=false;
   await saveCloud();
  }
 }
}

async function loadCloud(options={mode:"normal"}){
 if(!sb||!currentUser)return {found:false};
 try{
  const {data,error}=await sb.from("app_state").select("data,updated_at").eq("user_id",currentUser.id).maybeSingle();
  if(error)throw error;
  if(data?.data){
   S=data.data;
   saveLocal();
   cloudUpdatedAt=data.updated_at||new Date().toISOString();
   lastCloudMessage="Loaded from cloud • "+new Date(cloudUpdatedAt).toLocaleString();
   render();
   return {found:true};
  }
  lastCloudMessage="No cloud data exists yet.";
  renderData();
  return {found:false};
 }catch(e){
  lastCloudMessage="Cloud load failed: "+(e.message||e);
  renderData();
  return {found:false,error:e};
 }
}

async function uploadLocalToCloud(){
 if(!currentUser)return alert("Sign in first.");
 if(!confirm("Upload the data currently on THIS device to the cloud? This will replace the cloud copy."))return;
 await saveCloud();
 alert("This device's data was uploaded to the cloud.");
 renderData();
}

async function downloadCloudToDevice(){
 if(!currentUser)return alert("Sign in first.");
 const result=await loadCloud({mode:"manual"});
 if(result.found)alert("Cloud data loaded onto this device.");
 else alert("No cloud data was found.");
}

async function signUp(){
 if(!sb)return alert("Add your Supabase Project URL and Publishable Key first.");
 const email=document.getElementById("authEmail").value.trim();
 const password=document.getElementById("authPassword").value;
 if(!email||password.length<6)return alert("Enter an email and a password with at least 6 characters.");
 const {data,error}=await sb.auth.signUp({email,password});
 if(error)return alert(error.message);
 if(data.session){
  currentUser=data.user;
  await afterLogin();
  alert("Account created and signed in.");
 }else{
  alert("Account created. Check your email to confirm the account, then sign in.");
 }
}

async function signIn(){
 if(!sb)return alert("Add your Supabase Project URL and Publishable Key first.");
 const email=document.getElementById("authEmail").value.trim();
 const password=document.getElementById("authPassword").value;
 if(!email||!password)return alert("Enter your email and password.");
 const {data,error}=await sb.auth.signInWithPassword({email,password});
 if(error)return alert(error.message);
 currentUser=data.user;
 await afterLogin();
 alert("Signed in. Cloud synchronization is active.");
}

async function signOut(){
 if(!sb)return;
 await sb.auth.signOut();
 currentUser=null;
 cloudUpdatedAt=null;
 if(cloudChannel)sb.removeChannel(cloudChannel);
 if(cloudPollTimer)clearInterval(cloudPollTimer);
 cloudChannel=null;
 cloudPollTimer=null;
 lastCloudMessage="Signed out. This device will continue working offline.";
 renderData();
}

async function afterLogin(){
 renderData();
 const result=await loadCloud();
 if(!result.found && localHasData()){
  renderData();
 }
 setupRealtime();
 startCloudPolling();
 renderData();
}

function setupRealtime(){
 if(!sb||!currentUser)return;
 if(cloudChannel)sb.removeChannel(cloudChannel);
 realtimeStatus="connecting";
 cloudChannel=sb.channel("gamefowl-app-state-"+currentUser.id)
 .on("postgres_changes",
  {event:"*",schema:"public",table:"app_state",filter:"user_id=eq."+currentUser.id},
  async payload=>{
   if(payload.eventType==="DELETE")return;
   const remote=payload.new?.data;
   const remoteTime=payload.new?.updated_at;
   if(remote && remoteTime && (!cloudUpdatedAt || new Date(remoteTime)>new Date(cloudUpdatedAt))){
    S=remote;
    cloudUpdatedAt=remoteTime;
    saveLocal();
    lastCloudMessage="Updated from another device • "+new Date(remoteTime).toLocaleString();
    render();
   }
  })
 .subscribe((status)=>{
   realtimeStatus=status;
   if(status==="SUBSCRIBED"){
    lastCloudMessage="Cloud live sync connected.";
   }else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){
    lastCloudMessage="Live sync unavailable; automatic cloud checking is still active.";
   }
   renderData();
 });
}

function startCloudPolling(){
 if(cloudPollTimer)clearInterval(cloudPollTimer);
 cloudPollTimer=setInterval(checkCloudForChanges,5000);
}

async function checkCloudForChanges(){
 if(!sb||!currentUser||cloudBusy||document.hidden)return;
 try{
  const {data,error}=await sb.from("app_state").select("data,updated_at").eq("user_id",currentUser.id).maybeSingle();
  if(error)throw error;
  if(data?.data&&data.updated_at&&(!cloudUpdatedAt||new Date(data.updated_at)>new Date(cloudUpdatedAt))){
    S=data.data;
    cloudUpdatedAt=data.updated_at;
    saveLocal();
    lastCloudMessage="Updated from cloud • "+new Date(data.updated_at).toLocaleString();
    render();
  }
 }catch(e){ /* Realtime remains available; offline mode continues */ }
}

document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkCloudForChanges()});
window.addEventListener("focus",checkCloudForChanges);

const tabs=[["dashboard","Dashboard"],["trios","2 Trios"],["production","Production"],["sales","Sales"],["expenses","Expenses"],["partners","Partners"],["data","Cloud / Backup"]];
document.getElementById("nav").innerHTML=tabs.map((x,i)=>`<button class="${i?'':'active'}" onclick="tab('${x[0]}',this)">${x[1]}</button>`).join("");

function tab(id,b){
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");
 render();
}

function initialExpense(){
 return S.trios.reduce((a,t)=>a+Number(t.capital||0)+Number(t.housing||0),0)
 +S.expenses.filter(e=>e.type==="initial").reduce((a,e)=>a+Number(e.amount||0),0);
}
function totalExpenses(){return initialExpense()+S.expenses.filter(e=>e.type!=="initial").reduce((a,e)=>a+Number(e.amount||0),0)}
function productionTotals(trioId){
 let p=S.production.filter(x=>x.trioId===trioId);
 return {
  eggs:p.reduce((a,x)=>a+Number(x.eggs||0),0),
  infertile:p.reduce((a,x)=>a+Number(x.infertile||0),0),
  unhatched:p.reduce((a,x)=>a+Number(x.unhatched||0),0),
  hatched:p.reduce((a,x)=>a+Number(x.hatched||0),0),
  dead:p.reduce((a,x)=>a+Number(x.dead||0),0),
  unsaleable:p.reduce((a,x)=>a+Number(x.unsaleable||0),0),
  retained:p.reduce((a,x)=>a+Number(x.retained||0),0),
  saleable:p.reduce((a,x)=>a+Number(x.saleable||0),0)
 };
}
function soldQty(trioId){return S.sales.filter(x=>x.trioId===trioId).reduce((a,x)=>a+Number(x.qty||0),0)}
function revenue(){return S.sales.reduce((a,x)=>a+Number(x.qty||0)*Number(x.price||S.settings.salePrice),0)}
function cards(arr){return `<div class="grid">${arr.map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div>${x[2]?`<div class="muted">${x[2]}</div>`:""}</div>`).join("")}</div>`}
function peso(n){return "₱"+Number(n||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function renderDashboard(){
 let rev=revenue(),exp=totalExpenses(),profit=rev-exp;
 let potential=S.production.reduce((a,x)=>a+Number(x.saleable||0),0)*S.settings.salePrice;
 let sold=S.sales.reduce((a,x)=>a+Number(x.qty||0),0);
 document.getElementById("dashboard").innerHTML=`
 <section><h2>Project Dashboard</h2>${cards([
 ["Initial Expense / Capital",peso(initialExpense()),"Includes trio capital, housing/cages, and additional initial capital expenses"],
 ["Operating Expenses",peso(exp-initialExpense()),"Non-initial expenses"],
 ["Total Investment / Expenses",peso(exp)],
 ["Actual Revenue",peso(rev),`${sold} birds sold`],
 ["Net Profit / (Loss)",peso(profit)],
 ["Potential Revenue",peso(potential),"Based on recorded saleable birds × default sale price"],
 ["Unrealized Potential",peso(Math.max(0,potential-rev)),"Saleable production not yet realized as revenue"],
 ["Default Sale Price",peso(S.settings.salePrice)]
 ])}</section>
 <section><h2>Partner Income</h2>
 <div class="grid">${S.settings.partners.map(p=>{
  let income=S.sales.reduce((a,x)=>a+Number(x.qty||0)*(Number(x.price||S.settings.salePrice)/Number(S.settings.salePrice||1))*Number(p.share||0),0);
  return `<div class="card"><div class="label">${esc(p.name)}</div><div class="value">${peso(income)}</div><div class="muted">${peso(p.share)} per default ₱${Number(S.settings.salePrice).toLocaleString("en-PH")} sale</div></div>`;
 }).join("")}</div></section>
 <section><h2>Two Separate Trios</h2><div class="grid">${S.trios.map(t=>{
  let p=productionTotals(t.id),r=S.sales.filter(x=>x.trioId===t.id).reduce((a,x)=>a+x.qty*x.price,0),e=Number(t.capital||0)+Number(t.housing||0)+S.expenses.filter(x=>x.trioId===t.id).reduce((a,x)=>a+Number(x.amount||0),0);
  return `<div class="card trio"><h3>${esc(t.name)}</h3><div>${cards([["Initial Capital",peso(Number(t.capital)+Number(t.housing))],["Eggs",p.eggs],["Hatched",p.hatched],["Saleable",p.saleable],["Sold",soldQty(t.id)],["Revenue",peso(r)],["Expenses",peso(e)],["Net",peso(r-e)]])}</div></div>`;
 }).join("")}</div></section>
 <section class="notice"><b>Cloud:</b> ${currentUser?`Signed in as <b>${esc(currentUser.email)}</b>. Changes sync to the cloud and other signed-in devices.`:"Not signed in. The app still works offline and stores a local copy."}</section>`;
}

function renderTrios(){
 document.getElementById("trios").innerHTML=`<section><h2>Manage 2 Separate Trios</h2>${S.trios.map((t,i)=>`<div class="card trio" style="margin-bottom:12px"><h3>${esc(t.name)}</h3><div class="row">
 <label>Trio name<input id="tn${i}" value="${esc(t.name)}"></label>
 <label>Breeding capital<input type="number" id="tc${i}" value="${t.capital}"></label>
 <label>Housing / cage capital<input type="number" id="th${i}" value="${t.housing}"></label>
 <label>Notes<input id="tx${i}" value="${esc(t.notes)}"></label></div><button class="btn" onclick="updateTrio(${i})">Save Trio</button></div>`).join("")}</section>
 <section class="card"><h3>Add Another Capital Expense</h3><div class="muted">This goes directly into Initial Expense on the Dashboard.</div><div class="row">
 <label>Trio<select id="iceTrio">${S.trios.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label>
 <label>Description<input id="iceDesc" placeholder="e.g. additional cage materials"></label>
 <label>Amount<input id="iceAmt" type="number" min="0" step="0.01"></label></div><button class="btn" onclick="addInitialExpense()">Add to Initial Expense</button></section>`;
}
function updateTrio(i){S.trios[i].name=document.getElementById("tn"+i).value||i===0?"Golden Boy":"White Kelso";S.trios[i].capital=+document.getElementById("tc"+i).value||0;S.trios[i].housing=+document.getElementById("th"+i).value||0;S.trios[i].notes=document.getElementById("tx"+i).value;save()}
function addInitialExpense(){let a=+document.getElementById("iceAmt").value||0;if(!a)return alert("Enter an amount.");S.expenses.push({id:crypto.randomUUID(),date:new Date().toISOString().slice(0,10),trioId:document.getElementById("iceTrio").value,description:document.getElementById("iceDesc").value||"Additional capital expense",amount:a,type:"initial"});save()}

function renderProduction(){
 document.getElementById("production").innerHTML=`<section class="card"><h2>Production / Incubation</h2><div class="row"><label>Trio<select id="prTrio">${S.trios.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label>
 <label>Date<input id="prDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Eggs collected<input id="eggs" type="number" min="0"></label><label>Infertile<input id="infertile" type="number" min="0"></label><label>Failed / unhatched<input id="unhatched" type="number" min="0"></label><label>Hatched chicks<input id="hatched" type="number" min="0"></label><label>Dead chicks<input id="dead" type="number" min="0"></label><label>Living but unsaleable<input id="unsaleable" type="number" min="0"></label><label>Retained<input id="retained" type="number" min="0"></label><label>Saleable<input id="saleable" type="number" min="0"></label></div><button class="btn" onclick="addProduction()">Save Production Record</button></section>
 <section>${S.trios.map(t=>{let p=productionTotals(t.id);return `<div class="card trio"><h3>${esc(t.name)}</h3>${cards([["Eggs",p.eggs],["Infertile",p.infertile],["Unhatched",p.unhatched],["Hatched",p.hatched],["Dead",p.dead],["Unsaleable",p.unsaleable],["Retained",p.retained],["Saleable",p.saleable]])}</div>`}).join("")}</section>
 <section class="tablewrap"><table class="table"><tr><th>Date</th><th>Trio</th><th>Eggs</th><th>Hatched</th><th>Dead</th><th>Saleable</th></tr>${S.production.map(x=>`<tr><td>${x.date}</td><td>${esc(S.trios.find(t=>t.id===x.trioId)?.name)}</td><td>${x.eggs}</td><td>${x.hatched}</td><td>${x.dead}</td><td>${x.saleable}</td></tr>`).join("")}</table></section>`;
}
function addProduction(){let ids=["eggs","infertile","unhatched","hatched","dead","unsaleable","retained","saleable"];let x={id:crypto.randomUUID(),trioId:document.getElementById("prTrio").value,date:document.getElementById("prDate").value};ids.forEach(k=>x[k]=+document.getElementById(k).value||0);S.production.push(x);save()}

function renderSales(){
 document.getElementById("sales").innerHTML=`
 <section class="card">
  <h2>Sales</h2>
  <div class="row">
   <label>Trio<select id="saTrio">${S.trios.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label>
   <label>Date<input id="saDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label>
   <label>Quantity<input id="saQty" type="number" min="1" inputmode="numeric" placeholder="Number of birds"></label>
   <label>Price per bird<input id="saPrice" type="number" value="${S.settings.salePrice}" min="0" inputmode="decimal"></label>
   <label>Buyer / reference<input id="saBuyer" placeholder="Optional"></label>
  </div>
  <button class="btn" style="margin-top:10px;width:100%" onclick="addSale()">Record Sale</button>
 </section>

 <section class="mobile-only">
  <h2>Recorded Sales</h2>
  <div class="sales-mobile-list">
   ${S.sales.length?S.sales.map((x,i)=>`
    <div class="sale-card">
     <div class="sale-grid">
      <div class="sale-field"><label>Date</label><input id="m_sedate${i}" type="date" value="${x.date}"></div>
      <div class="sale-field"><label>Trio</label><select id="m_setrio${i}">${S.trios.map(t=>`<option value="${t.id}" ${t.id===x.trioId?"selected":""}>${esc(t.name)}</option>`).join("")}</select></div>
      <div class="sale-field"><label>Quantity</label><input id="m_seqty${i}" type="number" min="1" inputmode="numeric" value="${x.qty}"></div>
      <div class="sale-field"><label>Price / bird</label><input id="m_seprice${i}" type="number" min="0" inputmode="decimal" value="${x.price}"></div>
      <div class="sale-field" style="grid-column:1/-1"><label>Buyer / reference</label><input id="m_sebuyer${i}" value="${esc(x.buyer||"")}"></div>
     </div>
     <div class="sale-revenue">Revenue: ${peso(x.qty*x.price)}</div>
     <div class="sale-actions">
      <button class="btn" onclick="updateSaleMobile(${i})">Save Changes</button>
      <button class="btn danger" onclick="deleteSale(${i})">Delete</button>
     </div>
    </div>`).join(""):`<div class="card muted">No sales recorded yet.</div>`}
  </div>
 </section>

 <section class="tablewrap sales-wide-table">
  <table class="table">
   <tr><th>Date</th><th>Trio</th><th>Qty</th><th>Price</th><th>Revenue</th><th>Buyer</th><th>Action</th></tr>
   ${S.sales.map((x,i)=>`<tr>
    <td><input id="sedate${i}" type="date" value="${x.date}"></td>
    <td><select id="setrio${i}">${S.trios.map(t=>`<option value="${t.id}" ${t.id===x.trioId?"selected":""}>${esc(t.name)}</option>`).join("")}</select></td>
    <td><input id="seqty${i}" type="number" min="1" value="${x.qty}"></td>
    <td><input id="seprice${i}" type="number" min="0" value="${x.price}"></td>
    <td>${peso(x.qty*x.price)}</td>
    <td><input id="sebuyer${i}" value="${esc(x.buyer||"")}"></td>
    <td><div class="actions"><button class="btn" onclick="updateSale(${i})">Save</button><button class="btn danger" onclick="deleteSale(${i})">Delete</button></div></td>
   </tr>`).join("")}
  </table>
 </section>`;
}
function addSale(){let q=+document.getElementById("saQty").value||0,p=+document.getElementById("saPrice").value||0;if(!q)return alert("Enter quantity.");S.sales.push({id:crypto.randomUUID(),trioId:document.getElementById("saTrio").value,date:document.getElementById("saDate").value,qty:q,price:p,buyer:document.getElementById("saBuyer").value});save()}

function updateSale(i){
  let q=+document.getElementById("seqty"+i).value||0;
  let p=+document.getElementById("seprice"+i).value||0;
  if(!q)return alert("Enter quantity.");
  S.sales[i].date=document.getElementById("sedate"+i).value;
  S.sales[i].trioId=document.getElementById("setrio"+i).value;
  S.sales[i].qty=q;
  S.sales[i].price=p;
  S.sales[i].buyer=document.getElementById("sebuyer"+i).value;
  save();
  alert("Sale updated and synchronized.");
}
function updateSaleMobile(i){
 let q=+document.getElementById("m_seqty"+i).value||0;
 let p=+document.getElementById("m_seprice"+i).value||0;
 if(!q)return alert("Enter quantity.");
 S.sales[i].date=document.getElementById("m_sedate"+i).value;
 S.sales[i].trioId=document.getElementById("m_setrio"+i).value;
 S.sales[i].qty=q;
 S.sales[i].price=p;
 S.sales[i].buyer=document.getElementById("m_sebuyer"+i).value;
 save();
 alert("Sale updated and synchronized.");
}
function deleteSale(i){
  if(confirm("Delete this sale record? This will also change revenue and partner income.")){
    S.sales.splice(i,1);
    save();
  }
}
function renderExpenses(){
 document.getElementById("expenses").innerHTML=`<section class="card"><h2>Expenses</h2><div class="muted">Use <b>Initial</b> for additional capital expenses such as cages, housing, equipment, or other startup capital. These are consolidated into Initial Expense on the Dashboard.</div><div class="row"><label>Type<select id="exType"><option value="operating">Operating</option><option value="initial">Initial / Capital</option></select></label><label>Trio<select id="exTrio">${S.trios.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label><label>Date<input id="exDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Description<input id="exDesc"></label><label>Amount<input id="exAmt" type="number" min="0" step=".01"></label></div><button class="btn" onclick="addExpense()">Add Expense</button></section>
 <section class="tablewrap"><table class="table"><tr><th>Date</th><th>Type</th><th>Trio</th><th>Description</th><th>Amount</th></tr>${S.expenses.map(x=>`<tr><td>${x.date}</td><td><span class="pill">${x.type}</span></td><td>${esc(S.trios.find(t=>t.id===x.trioId)?.name)}</td><td>${esc(x.description)}</td><td>${peso(x.amount)}</td></tr>`).join("")}</table></section>`;
}
function addExpense(){let a=+document.getElementById("exAmt").value||0;if(!a)return alert("Enter amount.");S.expenses.push({id:crypto.randomUUID(),type:document.getElementById("exType").value,trioId:document.getElementById("exTrio").value,date:document.getElementById("exDate").value,description:document.getElementById("exDesc").value||"Expense",amount:a});save()}

function renderPartners(){
 document.getElementById("partners").innerHTML=`<section class="card"><h2>Partners & Sale Distribution</h2><div class="row"><label>Default sale price<input id="defPrice" type="number" value="${S.settings.salePrice}" min="0"></label>${S.settings.partners.map((p,i)=>`<label>${esc(p.name)}<input id="pn${i}" value="${esc(p.name)}" readonly></label><label>${esc(p.name)} share<input id="ps${i}" type="number" value="${p.share}" min="0" readonly></label>`).join("")}</div><button class="btn" onclick="savePartners()">Save Partner Settings</button><p class="muted">Partner allocation is fixed: Charson ₱500, Mark ₱250, Rik2 ₱250 per ₱1,000 sale.</p></section>
 <section class="grid">${S.settings.partners.map(p=>`<div class="card"><div class="label">${esc(p.name)}</div><div class="value">${peso(p.share)}</div><div class="muted">per default sale</div></div>`).join("")}</section>`;
}
function savePartners(){
 S.settings.salePrice=+document.getElementById("defPrice").value||0;
 S.settings.partners[0].name="Charson"; S.settings.partners[0].share=500;
 S.settings.partners[1].name="Mark"; S.settings.partners[1].share=250;
 S.settings.partners[2].name="Rik2"; S.settings.partners[2].share=250;
 save();
}
function renderData(){
 let authHtml="";
 if(!cloudConfigured){
  authHtml=`<div class="sync-warn"><b>Cloud sync is not configured yet.</b><br>Put your Supabase Project URL and Publishable Key into the two constants near the top of this file, then publish the updated file to GitHub Pages.</div>`;
 }else if(!currentUser){
  authHtml=`<section class="card"><h2>Cloud Login</h2><p class="muted">Use the same account on every phone/computer that should share the tracker.</p><div class="row"><label>Email<input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></label><label>Password<input id="authPassword" type="password" autocomplete="current-password" placeholder="At least 6 characters"></label></div><div class="actions"><button class="btn" onclick="signIn()">Sign In</button><button class="btn secondary" onclick="signUp()">Create Account</button></div></section>`;
 }else{
  authHtml=`<section class="card"><h2>Cloud Synchronization</h2>
  <div class="sync-ok"><b>Connected</b><br>${esc(currentUser.email)}<br><span class="small">Live sync: ${esc(realtimeStatus)}<br>${esc(lastCloudMessage||"Cloud sync is active.")}</span></div>
  <div class="actions"><button class="btn success" onclick="syncNow()">Sync Now</button><button class="btn secondary" onclick="uploadLocalToCloud()">Upload This Device</button><button class="btn secondary" onclick="downloadCloudToDevice()">Download Cloud</button><button class="btn danger" onclick="signOut()">Sign Out</button></div>
  <p class="muted">Every change is saved to the cloud when online. Other devices using the same account receive changes through live Realtime synchronization, with a 5-second automatic fallback check.</p></section>`;
 }
 document.getElementById("data").innerHTML=`${authHtml}
 <section class="card"><h2>Backup & Restore</h2><p class="muted">The app keeps a local browser copy for offline use. Cloud sync is the primary online backup when you are signed in.</p><div class="actions"><button class="btn" onclick="downloadBackup()">Export Backup</button><label class="btn secondary" style="display:inline-block;cursor:pointer">Import Backup<input type="file" accept=".json" style="display:none" onchange="importBackup(event)"></label><button class="btn danger" onclick="resetData()">Reset All Data</button></div></section>
 <section class="card"><h3>Important synchronization rule</h3><p class="muted">For the simplest shared setup, use the same Supabase login on all devices/phones that should edit this tracker. The last saved change becomes the current cloud version. Export Backup remains available as an additional safety copy.</p></section>
 <section class="card"><h3>Data structure</h3><p class="muted">Separate Trio 1 and Trio 2 accounting • eggs/incubation/hatching/deaths • saleable/retained/unsaleable • actual sales/revenue • initial and operating expenses • partner distribution • dashboard profit and recovery indicators.</p></section>`;
}

async function syncNow(){
 if(!currentUser)return alert("Sign in first.");
 await checkCloudForChanges();
 await saveCloud();
 alert("Sync complete.");
}

function downloadBackup(){let blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="gamefowl-finance-backup.json";a.click();URL.revokeObjectURL(a.href)}
function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.trios||!x.settings)throw 0;S=x;save();alert(currentUser?"Backup restored locally and synced to cloud.":"Backup restored.")}catch{alert("Invalid backup file.")}};r.readAsText(f)}
async function resetData(){if(confirm("Delete all records and restore a blank tracker?")){S=cloneDefault();await save()}}

function render(){renderDashboard();renderTrios();renderProduction();renderSales();renderExpenses();renderPartners();renderData()}

async function init(){
 render();
 if(!sb){return;}
 const {data}=await sb.auth.getSession();
 currentUser=data?.session?.user||null;
 if(currentUser){
  await afterLogin();
 }
 sb.auth.onAuthStateChange(async (_event,session)=>{
  currentUser=session?.user||null;
  if(currentUser) await afterLogin();
  else {cloudUpdatedAt=null;renderData();}
 });
}
init();
</script>
